apiVersion: v1
kind: ConfigMap
metadata:
  name: securebox-config
  namespace: securebox
data:
  # PostgreSQL Configuration
  POSTGRES_DB: secureboxdb
  POSTGRES_HOST: postgres-service
  POSTGRES_PORT: "5432"
  
  # MongoDB Configuration
  MONGODB_HOST: mongodb-service
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: secureboxlogs
  
  # Redis Configuration
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  
  # RabbitMQ Configuration
  RABBITMQ_HOST: rabbitmq-service
  RABBITMQ_PORT: "5672"
  RABBITMQ_MANAGEMENT_PORT: "15672"
  
  # API Configuration
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:5000
  ENABLE_SWAGGER: "true"
  DISABLE_HTTPS_REDIRECT: "true"
  
  # JWT Configuration
  JWT_ISSUER: SecureBoxAPI
  JWT_AUDIENCE: SecureBoxClients
  JWT_EXPIRY_MINUTES: "60"
  
  # CORS
  CORS_ALLOWED_ORIGINS: http://localhost,https://securebox.example.com

