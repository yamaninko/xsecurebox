apiVersion: v1
kind: Secret
metadata:
  name: securebox-secrets
  namespace: securebox
type: Opaque
stringData:
  # PostgreSQL Credentials
  POSTGRES_USER: secureboxuser
  POSTGRES_PASSWORD: CHANGE_ME
  
  # MongoDB Credentials
  MONGODB_USERNAME: secureboxuser
  MONGODB_PASSWORD: CHANGE_ME
  
  # Redis Password
  REDIS_PASSWORD: CHANGE_ME
  
  # RabbitMQ Credentials
  RABBITMQ_DEFAULT_USER: secureboxuser
  RABBITMQ_DEFAULT_PASS: CHANGE_ME
  
  # JWT Secret Key (256-bit for HS256)
  JWT_SECRET_KEY: CHANGE_ME_MIN_32_CHAR_JWT_SECRET______
  
  # Encryption Keys (AES-256) — 32 UTF-8 bytes
  ENCRYPTION_KEY: CHANGE_ME_32_BYTE_KEK_VALUE_HERE!
  ENCRYPTION_IV: unused-legacy-field
  
  # Connection Strings
  CONNECTION_STRING_POSTGRES: "Host=postgres-service;Port=5432;Database=secureboxdb;Username=secureboxuser;Password=CHANGE_ME"
  CONNECTION_STRING_MONGODB: "mongodb://secureboxuser:CHANGE_ME@mongodb-service:27017/secureboxlogs"
  CONNECTION_STRING_REDIS: "redis-service:6379,password=CHANGE_ME"
  CONNECTION_STRING_RABBITMQ: "amqp://secureboxuser:CHANGE_ME@rabbitmq-service:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  namespace: securebox
type: kubernetes.io/dockerconfigjson
data:
  # This will be created by CI/CD pipeline with actual credentials
  # kubectl create secret docker-registry harbor-registry-secret \
  #   --docker-server=$REGISTRY_URL \
  #   --docker-username=robot$account \
  #   --docker-password=$REGISTRY_TOKEN \
  #   --namespace=securebox
  .dockerconfigjson: e30K

