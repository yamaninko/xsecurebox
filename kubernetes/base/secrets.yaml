apiVersion: v1
kind: Secret
metadata:
  name: securebox-secrets
  namespace: securebox
type: Opaque
stringData:
  # PostgreSQL Credentials
  POSTGRES_USER: secureboxuser
  POSTGRES_PASSWORD: SecureBox2024!
  
  # MongoDB Credentials
  MONGODB_USERNAME: secureboxuser
  MONGODB_PASSWORD: SecureBox2024!
  
  # Redis Password
  REDIS_PASSWORD: SecureBox2024!
  
  # RabbitMQ Credentials
  RABBITMQ_DEFAULT_USER: secureboxuser
  RABBITMQ_DEFAULT_PASS: SecureBox2024!
  
  # JWT Secret Key (256-bit for HS256)
  JWT_SECRET_KEY: your-super-secret-jwt-key-change-this-in-production-min-32-chars
  
  # Encryption Keys (AES-256)
  ENCRYPTION_KEY: your-super-secret-encryption-key-32-bytes-exactly-here!
  ENCRYPTION_IV: your-secret-iv-16b
  
  # Connection Strings
  CONNECTION_STRING_POSTGRES: "Host=postgres-service;Port=5432;Database=secureboxdb;Username=secureboxuser;Password=SecureBox2024!"
  CONNECTION_STRING_MONGODB: "mongodb://secureboxuser:SecureBox2024!@mongodb-service:27017/secureboxlogs"
  CONNECTION_STRING_REDIS: "redis-service:6379,password=SecureBox2024!"
  CONNECTION_STRING_RABBITMQ: "amqp://secureboxuser:SecureBox2024!@rabbitmq-service:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  namespace: securebox
type: kubernetes.io/dockerconfigjson
data:
  # This will be created by CI/CD pipeline with actual credentials
  # kubectl create secret docker-registry harbor-registry-secret \
  #   --docker-server=$GTECH_REPO_URL \
  #   --docker-username=robot$account \
  #   --docker-password=$GTECH_REPO_TOKEN \
  #   --namespace=securebox
  .dockerconfigjson: e30K

