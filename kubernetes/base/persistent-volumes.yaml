---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: securebox-postgres-pv
  labels:
    app: postgres
    project: securebox
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: nfs.example.internal
    path: /home/nfs_share/securebox/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: securebox
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: postgres
      project: securebox
