---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv-securebox
  labels:
    app: mongodb
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.34.60.15
    path: /home/nfs_share/securebox/mongodb
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv-securebox
  labels:
    app: rabbitmq
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.34.60.15
    path: /home/nfs_share/securebox/rabbitmq

