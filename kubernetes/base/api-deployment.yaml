apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebox-api
  namespace: securebox
  labels:
    app: securebox-api
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: securebox-api
  template:
    metadata:
      labels:
        app: securebox-api
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-mongodb
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mongodb-service 27017; do echo waiting for mongodb; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;']
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z rabbitmq-service 5672; do echo waiting for rabbitmq; sleep 2; done;']
      containers:
      - name: api
        image: ${GTECH_REPO_URL}/securebox/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        # ConfigMap values
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: securebox-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: securebox-config
              key: ASPNETCORE_URLS
        - name: JWT__Issuer
          valueFrom:
            configMapKeyRef:
              name: securebox-config
              key: JWT_ISSUER
        - name: JWT__Audience
          valueFrom:
            configMapKeyRef:
              name: securebox-config
              key: JWT_AUDIENCE
        - name: JWT__ExpiryMinutes
          valueFrom:
            configMapKeyRef:
              name: securebox-config
              key: JWT_EXPIRY_MINUTES
        - name: CorsSettings__AllowedOrigins
          valueFrom:
            configMapKeyRef:
              name: securebox-config
              key: CORS_ALLOWED_ORIGINS
        # Secret values
        - name: JWT__SecretKey
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: JWT_SECRET_KEY
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: CONNECTION_STRING_POSTGRES
        - name: ConnectionStrings__MongoDb
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: CONNECTION_STRING_MONGODB
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: CONNECTION_STRING_REDIS
        - name: ConnectionStrings__RabbitMQ
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: CONNECTION_STRING_RABBITMQ
        - name: Encryption__Key
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: ENCRYPTION_KEY
        - name: Encryption__IV
          valueFrom:
            secretKeyRef:
              name: securebox-secrets
              key: ENCRYPTION_IV
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: securebox-api-service
  namespace: securebox
  labels:
    app: securebox-api
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: securebox-api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: securebox-api-hpa
  namespace: securebox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: securebox-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

