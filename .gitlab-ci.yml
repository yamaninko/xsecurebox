# Secure Box GitLab CI/CD Pipeline

stages:
  - build
  - test
  - push
  - deploy
  - cleanup

variables:
  DOCKER_BUILDKIT: "1"
  API_IMAGE: "${GTECH_REPO_URL}/securebox/api"
  PORTAL_IMAGE: "${GTECH_REPO_URL}/securebox/portal"
  KUBE_NAMESPACE: "securebox"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

# ============================================================================
# BUILD STAGE
# ============================================================================

build_api:
  stage: build
  script:
    - echo "Building API Docker Image"
    - docker info
    - echo "$GTECH_REPO_TOKEN" | docker login -u "$GTECH_REPO_USERNAME" --password-stdin "$GTECH_REPO_URL"
    - cd src/backend/SecureBox.API
    - docker build --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA --build-arg VERSION=$CI_COMMIT_REF_NAME --cache-from $API_IMAGE:latest --tag $API_IMAGE:$CI_COMMIT_SHORT_SHA --tag $API_IMAGE:$CI_COMMIT_REF_SLUG --file Dockerfile ..
    - docker save $API_IMAGE:$CI_COMMIT_SHORT_SHA | gzip > api-image.tar.gz
  artifacts:
    name: "api-image-$CI_COMMIT_SHORT_SHA"
    paths:
      - api-image.tar.gz
    expire_in: 1 hour
  only:
    - development
    - schedules
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

build_portal:
  stage: build
  script:
    - echo "Building Portal Docker Image"
    - docker info
    - echo "$GTECH_REPO_TOKEN" | docker login -u "$GTECH_REPO_USERNAME" --password-stdin "$GTECH_REPO_URL"
    - cd src/frontend
    - docker build --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA --build-arg VERSION=$CI_COMMIT_REF_NAME --cache-from $PORTAL_IMAGE:latest --tag $PORTAL_IMAGE:$CI_COMMIT_SHORT_SHA --tag $PORTAL_IMAGE:$CI_COMMIT_REF_SLUG --file Dockerfile .
    - docker save $PORTAL_IMAGE:$CI_COMMIT_SHORT_SHA | gzip > portal-image.tar.gz
  artifacts:
    name: "portal-image-$CI_COMMIT_SHORT_SHA"
    paths:
      - portal-image.tar.gz
    expire_in: 1 hour
  only:
    - development
    - schedules
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================================
# TEST STAGE
# ============================================================================

test_api:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - echo "Running API Tests"
    - cd src/backend
    - dotnet restore
    - dotnet build --no-restore
    - dotnet test --no-build --verbosity normal
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: src/backend/**/TestResults/*.xml
      coverage_report:
        coverage_format: cobertura
        path: src/backend/**/TestResults/coverage.cobertura.xml
    expire_in: 7 days
  only:
    - development
    - schedules

test_portal:
  stage: test
  image: node:20-alpine
  script:
    - echo "Running Portal Tests"
    - cd src/frontend
    - npm ci
    - npm run test -- --watch=false --browsers=ChromeHeadless
    - npm run lint
  artifacts:
    when: always
    reports:
      junit: src/frontend/test-results/*.xml
    expire_in: 7 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - src/frontend/node_modules/
  only:
    - development
    - schedules

# ============================================================================
# PUSH STAGE
# ============================================================================

push_api:
  stage: push
  dependencies:
    - build_api
  script:
    - echo "Pushing API Image to Harbor"
    - echo "$GTECH_REPO_TOKEN" | docker login -u "$GTECH_REPO_USERNAME" --password-stdin "$GTECH_REPO_URL"
    - docker load < api-image.tar.gz
    - docker push $API_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $API_IMAGE:$CI_COMMIT_REF_SLUG
    - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then docker tag $API_IMAGE:$CI_COMMIT_SHORT_SHA $API_IMAGE:latest; docker push $API_IMAGE:latest; echo "Pushed as latest tag"; fi
    - echo "API Image pushed successfully"
    - echo "Image - $API_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - development
    - schedules
  retry:
    max: 2
    when:
      - runner_system_failure

push_portal:
  stage: push
  dependencies:
    - build_portal
  script:
    - echo "Pushing Portal Image to Harbor"
    - echo "$GTECH_REPO_TOKEN" | docker login -u "$GTECH_REPO_USERNAME" --password-stdin "$GTECH_REPO_URL"
    - docker load < portal-image.tar.gz
    - docker push $PORTAL_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $PORTAL_IMAGE:$CI_COMMIT_REF_SLUG
    - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then docker tag $PORTAL_IMAGE:$CI_COMMIT_SHORT_SHA $PORTAL_IMAGE:latest; docker push $PORTAL_IMAGE:latest; echo "Pushed as latest tag"; fi
    - echo "Portal Image pushed successfully"
    - echo "Image - $PORTAL_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - development
    - schedules
  retry:
    max: 2
    when:
      - runner_system_failure

# ============================================================================
# DEPLOY STAGE
# ============================================================================

deploy_dev:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: development
    url: http://dev.securebox.local
    on_stop: cleanup_dev
  script:
    - echo "Deploying to Development Environment"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_DEV" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl version --client
    - kubectl cluster-info
    - kubectl create namespace $KUBE_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create secret docker-registry harbor-registry-secret --docker-server=$GTECH_REPO_URL --docker-username=$GTECH_REPO_USERNAME --docker-password=$GTECH_REPO_TOKEN --namespace=$KUBE_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - sed -i "s|\${GTECH_REPO_URL}|$GTECH_REPO_URL|g" kubernetes/base/*.yaml
    - sed -i "s|:latest|:$IMAGE_TAG|g" kubernetes/base/api-deployment.yaml
    - sed -i "s|:latest|:$IMAGE_TAG|g" kubernetes/base/portal-deployment.yaml
    - kubectl apply -f kubernetes/base/configmap.yaml
    - kubectl apply -f kubernetes/base/secrets.yaml
    - kubectl apply -f kubernetes/base/postgres-deployment.yaml
    - kubectl apply -f kubernetes/base/mongodb-deployment.yaml
    - kubectl apply -f kubernetes/base/redis-deployment.yaml
    - kubectl apply -f kubernetes/base/rabbitmq-deployment.yaml
    - kubectl wait --for=condition=ready pod -l app=postgres -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl wait --for=condition=ready pod -l app=mongodb -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl wait --for=condition=ready pod -l app=redis -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl wait --for=condition=ready pod -l app=rabbitmq -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl apply -f kubernetes/base/api-deployment.yaml
    - kubectl apply -f kubernetes/base/portal-deployment.yaml
    - kubectl apply -f kubernetes/base/nginx-configmap.yaml
    - kubectl apply -f kubernetes/base/nginx-deployment.yaml
    - kubectl rollout status deployment/securebox-api -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/securebox-portal -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/nginx -n $KUBE_NAMESPACE --timeout=300s
    - echo "Status Deployment Status:"
    - kubectl get deployments -n $KUBE_NAMESPACE
    - kubectl get pods -n $KUBE_NAMESPACE
    - kubectl get services -n $KUBE_NAMESPACE
    - echo "Deployment to DEV completed successfully!"
  only:
    - development
    - schedules
  when: manual
  retry:
    max: 1
    when:
      - runner_system_failure

deploy_production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://securebox.example.com
    on_stop: cleanup_production
  script:
    - echo "Deploying to Production Environment"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_PROD" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl version --client
    - kubectl cluster-info
    - kubectl create namespace $KUBE_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create secret docker-registry harbor-registry-secret --docker-server=$GTECH_REPO_URL --docker-username=$GTECH_REPO_USERNAME --docker-password=$GTECH_REPO_TOKEN --namespace=$KUBE_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - sed -i "s|\${GTECH_REPO_URL}|$GTECH_REPO_URL|g" kubernetes/base/*.yaml
    - sed -i "s|:latest|:$IMAGE_TAG|g" kubernetes/base/api-deployment.yaml
    - sed -i "s|:latest|:$IMAGE_TAG|g" kubernetes/base/portal-deployment.yaml
    - kubectl apply -f kubernetes/base/configmap.yaml
    - kubectl apply -f kubernetes/base/secrets.yaml
    - kubectl apply -f kubernetes/base/postgres-deployment.yaml
    - kubectl apply -f kubernetes/base/mongodb-deployment.yaml
    - kubectl apply -f kubernetes/base/redis-deployment.yaml
    - kubectl apply -f kubernetes/base/rabbitmq-deployment.yaml
    - kubectl wait --for=condition=ready pod -l app=postgres -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl wait --for=condition=ready pod -l app=mongodb -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl wait --for=condition=ready pod -l app=redis -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl wait --for=condition=ready pod -l app=rabbitmq -n $KUBE_NAMESPACE --timeout=300s || true
    - kubectl apply -f kubernetes/base/api-deployment.yaml
    - kubectl apply -f kubernetes/base/portal-deployment.yaml
    - kubectl apply -f kubernetes/base/nginx-configmap.yaml
    - kubectl apply -f kubernetes/base/nginx-deployment.yaml
    - kubectl rollout status deployment/securebox-api -n $KUBE_NAMESPACE --timeout=600s
    - kubectl rollout status deployment/securebox-portal -n $KUBE_NAMESPACE --timeout=600s
    - kubectl rollout status deployment/nginx -n $KUBE_NAMESPACE --timeout=600s
    - echo "Status Production Deployment Status:"
    - kubectl get deployments -n $KUBE_NAMESPACE
    - kubectl get pods -n $KUBE_NAMESPACE
    - kubectl get services -n $KUBE_NAMESPACE
    - echo "Production Deployment completed successfully!"
  only:
    - main
  when: manual
  retry:
    max: 1
    when:
      - runner_system_failure

# ============================================================================
# CLEANUP STAGE
# ============================================================================

cleanup_dev:
  stage: cleanup
  image: bitnami/kubectl:latest
  environment:
    name: development
    action: stop
  script:
    - echo "Cleaning up Development Environment"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_DEV" | base64 -d > ~/.kube/config
    - kubectl delete namespace $KUBE_NAMESPACE --ignore-not-found=true
    - echo "Development environment cleaned up"
  when: manual
  only:
    - development

cleanup_production:
  stage: cleanup
  image: bitnami/kubectl:latest
  environment:
    name: production
    action: stop
  script:
    - echo "WARNING Production cleanup is disabled for safety"
    - exit 1
  when: manual
  only:
    - main

cleanup_docker:
  stage: cleanup
  script:
    - echo "Cleaning up Docker resources"
    - docker system prune -af --volumes
    - docker builder prune -af
    - echo "Docker cleanup completed"
  when: always
  allow_failure: true
  only:
    - development
    - schedules
