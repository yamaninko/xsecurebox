services:
  postgres:
    image: postgres:16-alpine
    container_name: securebox-postgres
    environment:
      POSTGRES_DB: secureboxdb
      POSTGRES_USER: securebox_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebox_user -d secureboxdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securebox-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  eth-1:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: securebox-eth-1
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "4242", "--block-time", "1"]
    ports:
      - "127.0.0.1:8545:8545"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-1:
    build:
      context: ./src/backend
      dockerfile: SecureBox.API/Dockerfile
    container_name: securebox-api-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - EnableSwagger=true
      - DisableHttpsRedirect=true
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=secureboxdb;Username=securebox_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - JwtSettings__Issuer=SecureBoxAPI
      - JwtSettings__Audience=SecureBoxPortal
      - Encryption__KeyEncryptionKey=${ENCRYPTION_KEK:?Set ENCRYPTION_KEK in .env}
      - Database__DefaultAdminPassword=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - Database__ApplyMigrationsOnStartup=false
      - Database__SeedDefaultsOnStartup=true
      - Ethereum__Enabled=true
      - Ethereum__ChainId=4242
      - Ethereum__RpcUrls__0=http://eth-1:8545
      - Ethereum__Quorum=1
      - Ethereum__RequireOnRetrieve=true
      - Ethereum__SystemName=xsecurebox
      - Ethereum__PrivateKey=${ETHEREUM_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ./logs/api-1:/app/logs
    ports:
      - "127.0.0.1:5002:5000"
    networks:
      - backend-network
      - frontend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eth-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-2:
    build:
      context: ./src/backend
      dockerfile: SecureBox.API/Dockerfile
    container_name: securebox-api-2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - EnableSwagger=true
      - DisableHttpsRedirect=true
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=secureboxdb;Username=securebox_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - JwtSettings__Issuer=SecureBoxAPI
      - JwtSettings__Audience=SecureBoxPortal
      - Encryption__KeyEncryptionKey=${ENCRYPTION_KEK:?Set ENCRYPTION_KEK in .env}
      - Database__DefaultAdminPassword=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - Database__ApplyMigrationsOnStartup=false
      - Database__SeedDefaultsOnStartup=true
      - Ethereum__Enabled=true
      - Ethereum__ChainId=4242
      - Ethereum__RpcUrls__0=http://eth-1:8545
      - Ethereum__Quorum=1
      - Ethereum__RequireOnRetrieve=true
      - Ethereum__SystemName=xsecurebox
      - Ethereum__PrivateKey=${ETHEREUM_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ./logs/api-2:/app/logs
    networks:
      - backend-network
      - frontend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eth-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  portal:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: securebox-portal
    networks:
      - frontend-network
    depends_on:
      - api-1
      - api-2

  nginx:
    image: nginx:alpine
    container_name: securebox-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend-network
    depends_on:
      - api-1
      - api-2
      - portal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
