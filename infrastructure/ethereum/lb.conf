upstream eth_cluster {
        least_conn;
        server securebox-eth-1:8545 max_fails=2 fail_timeout=5s;
        server securebox-eth-2:8545 max_fails=2 fail_timeout=5s;
}
server {
    listen 8545;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_pass http://eth_cluster;
    }
}
