<div class="layout-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar-open]="sidebarOpen">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🔐</span>
        <span class="logo-text" *ngIf="sidebarOpen">Secure Box</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a 
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        [class.hidden]="!hasAccess(item)"
        [title]="item.label">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="currentUser && sidebarOpen">
        <div class="user-avatar">
          {{ currentUser.username.charAt(0).toUpperCase() }}
        </div>
        <div class="user-details">
          <div class="user-name">{{ currentUser.username }}</div>
          <div class="user-role">{{ currentUser.roles[0] }}</div>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" [title]="sidebarOpen ? 'Logout' : 'Çıkış'">
        <span class="logout-icon">🚪</span>
        <span *ngIf="sidebarOpen">Çıkış</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content" [class.sidebar-open]="sidebarOpen">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="menu-toggle" (click)="toggleSidebar()">
        <span class="hamburger-icon">☰</span>
      </button>
      <div class="top-bar-title">Secure Box Portal</div>
      <div class="top-bar-user" *ngIf="currentUser">
        <span class="user-greeting">Merhaba, <strong>{{ currentUser.username }}</strong></span>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
