<div class="login-container">
  <mat-card class="login-card">
    <div class="login-card-content">
      <div class="login-header">
        <mat-icon class="login-icon">lock</mat-icon>
        <h1 class="login-title">Secure Box</h1>
        <p class="login-subtitle">Güvenli Anahtar Yönetim Sistemi</p>
      </div>
      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Kullanıcı Adı</mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Kullanıcı adınızı girin"
            autocomplete="username"
            [disabled]="isLoading"
          />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            {{ usernameError }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Şifre</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Şifrenizi girin"
            autocomplete="current-password"
            [disabled]="isLoading"
          />
          <mat-icon matPrefix>vpn_key</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [disabled]="isLoading"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{ passwordError }}
          </mat-error>
        </mat-form-field>

        <div class="remember-me-container">
          <mat-checkbox formControlName="rememberMe" color="primary">
            Beni Hatırla
          </mat-checkbox>
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          [disabled]="isLoading"
        >
          <mat-spinner *ngIf="isLoading" diameter="24" class="button-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Giriş Yap</span>
        </button>
      </form>

      <form *ngIf="mfaChallengeId" (ngSubmit)="submitMfa()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>MFA kodu</mat-label>
          <input matInput [(ngModel)]="mfaCode" name="mfaCode" maxlength="6" autocomplete="one-time-code">
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" class="login-button" [disabled]="isLoading || mfaCode.length < 6">
          Doğrula
        </button>
      </form>

      <div class="login-info">
        <mat-icon class="info-icon">info</mat-icon>
        <p>İlk girişte yönetici şifresini değiştirmeniz gerekir.</p>
      </div>

      <div class="documentation-link">
        <mat-icon class="doc-icon">description</mat-icon>
        <a href="/assets/docs/index.html" target="_blank" rel="noopener noreferrer" class="doc-link">
          <span>📚 Proje Dokümantasyonu</span>
          <mat-icon class="external-icon">open_in_new</mat-icon>
        </a>
      </div>
    </div>
  </mat-card>

  <div class="login-footer">
    <p>&copy; 2025 Secure Box. Tüm hakları saklıdır.</p>
  </div>
</div>
