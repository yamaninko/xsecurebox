<div class="login-container">
  <mat-card class="login-card">
    <div class="login-card-content">
      <div class="login-header">
        <mat-icon class="login-icon">lock</mat-icon>
        <h1 class="login-title">Secure Box</h1>
        <p class="login-subtitle">Güvenli Anahtar Yönetim Sistemi</p>
      </div>
      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Kullanıcı Adı</mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Kullanıcı adınızı girin"
            autocomplete="username"
            [disabled]="isLoading"
          />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            {{ usernameError }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Şifre</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Şifrenizi girin"
            autocomplete="current-password"
            [disabled]="isLoading"
          />
          <mat-icon matPrefix>vpn_key</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [disabled]="isLoading"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{ passwordError }}
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          [disabled]="isLoading"
        >
          <mat-spinner *ngIf="isLoading" diameter="24" class="button-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Giriş Yap</span>
        </button>
      </form>

      <div class="login-info">
        <mat-icon class="info-icon">info</mat-icon>
        <p>Varsayılan kullanıcı: <strong>admin</strong> / <strong>Admin&#64;123</strong></p>
      </div>
    </div>
  </mat-card>

  <div class="login-footer">
    <p>&copy; 2025 Secure Box. Tüm hakları saklıdır.</p>
  </div>
</div>
