name: Build and Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  API_IMAGE_NAME: securebox/api
  PORTAL_IMAGE_NAME: securebox/portal

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run tests
        run: dotnet test src/backend/SecureBox.sln --nologo

  build-api:
    name: Build and Push API
    runs-on: ubuntu-latest
    needs: test-api
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels) for API
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/SecureBox.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Clean up Docker resources
        if: always()
        run: |
          docker builder prune -f
          docker system prune -af --volumes

  build-portal:
    name: Build and Push Portal
    runs-on: ubuntu-latest
    needs: test-api
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels) for Portal
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PORTAL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Portal Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Clean up Docker resources
        if: always()
        run: |
          docker builder prune -f
          docker system prune -af --volumes

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build-api, build-portal]
    if: always()
    
    steps:
      - name: Build Success Notification
        if: ${{ needs.build-api.result == 'success' && needs.build-portal.result == 'success' }}
        run: |
          echo "✅ Build başarılı! Tüm image'lar Harbor'a push edildi."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "API Image: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest"
          echo "Portal Image: ${{ env.REGISTRY }}/${{ env.PORTAL_IMAGE_NAME }}:latest"

      - name: Build Failure Notification
        if: ${{ needs.build-api.result == 'failure' || needs.build-portal.result == 'failure' }}
        run: |
          echo "❌ Build başarısız!"
          echo "API Build: ${{ needs.build-api.result }}"
          echo "Portal Build: ${{ needs.build-portal.result }}"
          exit 1

